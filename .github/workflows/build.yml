name: Native VDR 2.8 build and artwork tests

on:
  push:
  pull_request:

jobs:
  navigation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test remote navigation without display device
        run: make check-navigation

  logos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify local sender-logo name matching and safe fallback
        run: make check-logos

  core-admin-navigation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify Human login keyboard and TV admin navigation
        run: make check-core-admin-navigation

  core-admin-http:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install existing Core client HTTP and JSON libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libjson-c-dev
      - name: Verify Human session, CSRF and ETag operations via mock Core
        run: make check-core-admin-http

  settings-navigation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify VDR/Suite settings owner navigation and native actions
        run: make check-settings-navigation

  recording-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify folder/genre/all navigation and recording sorting
        run: make check-recording-browser

  epg-timeline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify channel navigation and proportional EPG event geometry
        run: make check-epg-timeline

  artwork:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev libjpeg-dev
      - name: Verify PNG and JPEG decode with fixture images
        run: make check-artwork

  native-vdr:
    name: VDR ${{ matrix.vdr }}
    strategy:
      fail-fast: false
      matrix:
        vdr: ["2.8.3", "2.8.4"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vdr-projects/vdr
          ref: ${{ matrix.vdr }}
          path: upstream/vdr
          persist-credentials: false
      - name: Install toolchain and package metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config vdr-dev libpng-dev libjpeg-dev libcurl4-openssl-dev libjson-c-dev
      - name: Compile plugin against exact upstream VDR header version
        run: |
          make VDR_SOURCE_PARENT=upstream -j2
          test -s libvdr-suiteosd.so
