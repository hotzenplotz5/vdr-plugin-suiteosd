name: VDR plugin build smoke test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install VDR development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config vdr-dev
      - name: Build native VDR plugin as regular runner user
        run: |
          pkg-config --modversion vdr
          pkg-config --variable=apiversion vdr
          make -j2
          test -s libvdr-suiteosd.so
